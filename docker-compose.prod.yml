services:
  mongo:
    image: mongo:8
    container_name: osgfest_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-osgfest}
    volumes:
      - mongo_data:/data/db
    networks:
      osgfest_net:
        aliases:
          - mongo
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep 1 >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  osgfest-backoffice:
    build:
      context: .
      dockerfile: Dockerfile
    image: osgfest-app:latest
    container_name: osgfest_backoffice
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_SURFACE: backoffice
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      PRINTER_EMULATOR_HOST: ${PRINTER_EMULATOR_HOST:-printer-emulator}
      PRINTER_EMULATOR_START_PORT: ${PRINTER_EMULATOR_START_PORT:-19100}
      PORT: 3000
    ports:
      - '127.0.0.1:3101:3000'
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - osgfest_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health')
          .then((r) => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  osgfest-menu:
    image: osgfest-app:latest
    container_name: osgfest_menu
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      osgfest-backoffice:
        condition: service_started
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      APP_SURFACE: menu
      NEXTAUTH_URL: ${NEXTAUTH_URL_MENU}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      PRINTER_EMULATOR_HOST: ${PRINTER_EMULATOR_HOST:-printer-emulator}
      PRINTER_EMULATOR_START_PORT: ${PRINTER_EMULATOR_START_PORT:-19100}
      PORT: 3000
    ports:
      - '127.0.0.1:3102:3000'
    volumes:
      - ./public/uploads:/app/public/uploads
    networks:
      - osgfest_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health')
          .then((r) => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  printer-emulator:
    image: node:20-alpine
    container_name: osgfest_printer_emulator
    restart: unless-stopped
    profiles:
      - demo
    working_dir: /app
    command: ["node", "scripts/printer-emulator.mjs"]
    environment:
      PRINTER_EMULATOR_START_PORT: 19100
      PRINTER_EMULATOR_COUNT: 10
      PRINTER_EMULATOR_OUTPUT_DIR: /data/printer-emulator
    volumes:
      - ./:/app:ro
      - printer_emulator_data:/data/printer-emulator
    networks:
      - osgfest_net

volumes:
  mongo_data:
    name: osgfest_mongo_data
  printer_emulator_data:
    name: osgfest_printer_emulator_data

networks:
  osgfest_net:
    name: osgfest_net
    ipam:
      config:
        - subnet: 10.202.0.0/24
