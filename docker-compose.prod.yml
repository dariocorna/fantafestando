x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    logging: *default-logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-fantafestando}
    volumes:
      - mongo_data:/data/db
    networks:
      fantafestando_net:
        aliases:
          - mongo
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          --username "$${MONGO_INITDB_ROOT_USERNAME}"
          --password "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep 1 >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  fantafestando-backoffice:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE_NAME:-fantafestando-app}:${APP_IMAGE_TAG:-latest}
    logging: *default-logging
    user: '${APP_RUNTIME_UID:-1000}:${APP_RUNTIME_GID:-1000}'
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - ${APP_RUNTIME_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      APP_SURFACE: backoffice
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      PRINTER_EMULATOR_HOST: ${PRINTER_EMULATOR_HOST:-printer-emulator}
      PRINTER_EMULATOR_START_PORT: ${PRINTER_EMULATOR_START_PORT:-19100}
      PRINTER_EMULATOR_OUTPUT_DIR: /data/printer-emulator
      BACKUP_TARGETS_ROOT: /data/backup-targets
      BACKUP_SCHEDULER_POLL_SECONDS: ${BACKUP_SCHEDULER_POLL_SECONDS:-60}
      ORACLE_TUNNEL_CONTROL_TOKEN: ${ORACLE_TUNNEL_CONTROL_TOKEN:-}
      REMOTE_POS_HOSTNAME: ${REMOTE_POS_HOSTNAME:-}
      REMOTE_POS_MARKER_SECRET: ${REMOTE_POS_MARKER_SECRET:-}
      PORT: 3000
    ports:
      - '${BACKOFFICE_BIND_HOST:-127.0.0.1}:${BACKOFFICE_BIND_PORT:-3101}:3000'
    volumes:
      - ./public/uploads:/app/public/uploads
      - ${BACKUP_TARGETS_HOST_ROOT:-/media}:/data/backup-targets:rw
      - printer_emulator_data:/data/printer-emulator:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fantafestando_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health')
          .then((r) => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  fantafestando-menu:
    image: ${APP_IMAGE_NAME:-fantafestando-app}:${APP_IMAGE_TAG:-latest}
    logging: *default-logging
    user: '${APP_RUNTIME_UID:-1000}:${APP_RUNTIME_GID:-1000}'
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      fantafestando-backoffice:
        condition: service_started
    env_file:
      - ${APP_RUNTIME_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      APP_SURFACE: menu
      NEXTAUTH_URL: ${NEXTAUTH_URL_MENU:-${NEXTAUTH_URL:?NEXTAUTH_URL is required}}
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      PRINTER_EMULATOR_HOST: ${PRINTER_EMULATOR_HOST:-printer-emulator}
      PRINTER_EMULATOR_START_PORT: ${PRINTER_EMULATOR_START_PORT:-19100}
      PRINTER_EMULATOR_OUTPUT_DIR: /data/printer-emulator
      PORT: 3000
    ports:
      - '127.0.0.1:${MENU_BIND_PORT:-3102}:3000'
    volumes:
      - ./public/uploads:/app/public/uploads
      - printer_emulator_data:/data/printer-emulator:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fantafestando_net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health')
          .then((r) => process.exit(r.ok ? 0 : 1))
          .catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  printer-emulator:
    image: node:20-alpine
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - demo
    working_dir: /app
    command: ["node", "scripts/printer-emulator.mjs"]
    environment:
      PRINTER_EMULATOR_START_PORT: 19100
      PRINTER_EMULATOR_COUNT: 10
      PRINTER_EMULATOR_OUTPUT_DIR: /data/printer-emulator
    volumes:
      - ./:/app:ro
      - printer_emulator_data:/data/printer-emulator
    networks:
      - fantafestando_net

  oracle-menu-tunnel:
    build:
      context: .
      dockerfile: docker/oracle-menu-tunnel/Dockerfile
    image: ${APP_IMAGE_NAME:-fantafestando-app}-oracle-menu-tunnel:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    profiles:
      - oracle-tunnel
    depends_on:
      fantafestando-menu:
        condition: service_healthy
      fantafestando-backoffice:
        condition: service_healthy
    env_file:
      - ${APP_RUNTIME_ENV_FILE:-.env.production}
    environment:
      ORACLE_TUNNEL_HOST: ${ORACLE_TUNNEL_HOST:-}
      ORACLE_TUNNEL_USER: ${ORACLE_TUNNEL_USER:-}
      ORACLE_TUNNEL_KEY_PATH: /run/oracle-tunnel/${ORACLE_TUNNEL_KEY_FILENAME:-id_ed25519}
      ORACLE_TUNNEL_REMOTE_BIND_ADDRESS: ${ORACLE_TUNNEL_REMOTE_BIND_ADDRESS:-127.0.0.1}
      ORACLE_TUNNEL_REMOTE_PORT: ${ORACLE_TUNNEL_REMOTE_PORT:-3302}
      ORACLE_TUNNEL_LOCAL_HOST: ${ORACLE_TUNNEL_LOCAL_HOST:-fantafestando-menu}
      ORACLE_TUNNEL_LOCAL_PORT: ${ORACLE_TUNNEL_LOCAL_PORT:-3000}
      ORACLE_TUNNEL_ADMIN_REMOTE_PORT: ${ORACLE_TUNNEL_ADMIN_REMOTE_PORT:-3304}
      ORACLE_TUNNEL_ADMIN_LOCAL_HOST: ${ORACLE_TUNNEL_ADMIN_LOCAL_HOST:-fantafestando-backoffice}
      ORACLE_TUNNEL_ADMIN_LOCAL_PORT: ${ORACLE_TUNNEL_ADMIN_LOCAL_PORT:-3000}
      ORACLE_TUNNEL_POS_REMOTE_PORT: ${ORACLE_TUNNEL_POS_REMOTE_PORT:-3305}
      ORACLE_TUNNEL_POS_LOCAL_HOST: ${ORACLE_TUNNEL_POS_LOCAL_HOST:-fantafestando-backoffice}
      ORACLE_TUNNEL_POS_LOCAL_PORT: ${ORACLE_TUNNEL_POS_LOCAL_PORT:-3000}
      ORACLE_TUNNEL_SSH_REMOTE_PORT: ${ORACLE_TUNNEL_SSH_REMOTE_PORT:-3322}
      ORACLE_TUNNEL_SSH_LOCAL_HOST: ${ORACLE_TUNNEL_SSH_LOCAL_HOST:-host.docker.internal}
      ORACLE_TUNNEL_SSH_LOCAL_PORT: ${ORACLE_TUNNEL_SSH_LOCAL_PORT:-22}
      ORACLE_TUNNEL_CONTROL_URL: http://fantafestando-backoffice:3000/api/internal/remote-access
      ORACLE_TUNNEL_CONTROL_TOKEN: ${ORACLE_TUNNEL_CONTROL_TOKEN:?ORACLE_TUNNEL_CONTROL_TOKEN is required}
      ORACLE_TUNNEL_CONTROL_POLL_MS: ${ORACLE_TUNNEL_CONTROL_POLL_MS:-5000}
      ORACLE_TUNNEL_SERVER_ALIVE_INTERVAL: ${ORACLE_TUNNEL_SERVER_ALIVE_INTERVAL:-30}
      ORACLE_TUNNEL_SERVER_ALIVE_COUNT_MAX: ${ORACLE_TUNNEL_SERVER_ALIVE_COUNT_MAX:-3}
      ORACLE_TUNNEL_STRICT_HOST_KEY_CHECKING: ${ORACLE_TUNNEL_STRICT_HOST_KEY_CHECKING:-accept-new}
    volumes:
      - ${ORACLE_TUNNEL_SSH_DIR_HOST:-./.docker/oracle-menu-tunnel}:/run/oracle-tunnel:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fantafestando_net

volumes:
  mongo_data:
  printer_emulator_data:

networks:
  fantafestando_net:
