services:
  mongodb:
    image: mongo:latest
    restart: unless-stopped
    ports:
      # Loopback only: these are throwaway dev credentials and the host also
      # runs the production stack on the same LAN.
      - "127.0.0.1:27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=fantafestando
    volumes:
      - mongodb_data:/data/db
    networks:
      - fantafestando_dev_net

  printer-emulator:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["node", "scripts/printer-emulator.mjs"]
    environment:
      - PRINTER_EMULATOR_START_PORT=19100
      - PRINTER_EMULATOR_COUNT=10
      - PRINTER_EMULATOR_OUTPUT_DIR=/data/printer-emulator
    volumes:
      - ./:/app:ro
      - printer_emulator_data:/data/printer-emulator
    ports:
      - "127.0.0.1:19100-19109:19100-19109"
    networks:
      - fantafestando_dev_net

volumes:
  mongodb_data:
  printer_emulator_data:

networks:
  fantafestando_dev_net:
    name: fantafestando_dev_net
